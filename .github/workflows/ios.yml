name: iOS

# Запускаем при push в main, при pull request в main и вручную из вкладки Actions
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    # iOS можно собирать ТОЛЬКО на macOS-раннерах
    runs-on: macos-14
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable   # stable канал (совпадает с .metadata)
          cache: true       # кэшируем Dart/Flutter для ускорения

      - name: Установка зависимостей
        run: flutter pub get

      - name: Статический анализ
        run: flutter analyze

      - name: Запуск тестов
        run: flutter test

      # --no-codesign: сборка без подписи. Так CI соберёт .app, не требуя
      # сертификатов Apple. Для публикации в App Store нужна подпись (см. заметку ниже).
      - name: Сборка iOS (release, без подписи)
        run: flutter build ios --release --no-codesign

      - name: Загрузка собранного приложения как артефакта
        uses: actions/upload-artifact@v4
        with:
          name: walkie-talkie-ios
          path: build/ios/iphoneos/*.app
